<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Danh Sách Hoàn Thành Khoản Thu</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
        .glass-panel {
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.4);
        }
        .animate-fade-in { animation: fadeIn 0.5s ease-out forwards; }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body class="bg-gradient-to-br from-indigo-50 via-white to-blue-50 min-h-screen p-4 md:p-8">

    <div class="max-w-4xl mx-auto">
        <!-- Header -->
        <div class="text-center mb-8 animate-fade-in">
            <h1 class="text-3xl md:text-4xl font-bold text-indigo-800 mb-3 drop-shadow-sm">
                <i class="fa-solid fa-circle-check text-emerald-500 mr-2"></i>Danh Sách Đã Thu
            </h1>
            <p class="text-gray-600 font-medium bg-white/60 inline-block px-4 py-1 rounded-full shadow-sm">
                Cập nhật tự động từ hệ thống
            </p>
        </div>

        <!-- Main Content -->
        <div class="glass-panel rounded-2xl shadow-xl overflow-hidden animate-fade-in" style="animation-delay: 0.1s;">
            
            <!-- Toolbar -->
            <div class="p-5 bg-white/70 border-b border-gray-100 flex flex-col sm:flex-row justify-between items-center gap-4">
                <div class="relative w-full sm:w-72">
                    <input type="text" id="searchInput" placeholder="Tìm kiếm học sinh..." class="w-full pl-10 pr-4 py-2.5 rounded-xl border border-gray-200 focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-transparent transition-all shadow-sm">
                    <i class="fa-solid fa-search absolute left-3.5 top-1/2 transform -translate-y-1/2 text-gray-400"></i>
                </div>
                
                <button onclick="loadData()" id="refreshBtn" class="w-full sm:w-auto bg-indigo-600 hover:bg-indigo-700 active:bg-indigo-800 text-white px-6 py-2.5 rounded-xl font-medium transition-all flex items-center justify-center gap-2 shadow-md hover:shadow-lg transform hover:-translate-y-0.5">
                    <i class="fa-solid fa-rotate-right" id="refreshIcon"></i> Làm mới
                </button>
            </div>

            <!-- Table -->
            <div class="overflow-x-auto">
                <table class="w-full text-left border-collapse">
                    <thead>
                        <tr class="bg-indigo-50/90 text-indigo-900 border-b border-indigo-100 text-sm uppercase tracking-wider">
                            <th class="p-4 font-semibold w-16 text-center">STT</th>
                            <th class="p-4 font-semibold">Họ và Tên</th>
                            <th class="p-4 font-semibold text-right">Số Tiền</th>
                            <th class="p-4 font-semibold text-center">Hình Thức</th>
                        </tr>
                    </thead>
                    <tbody id="dataTableBody" class="divide-y divide-gray-100 bg-white/40">
                        <!-- Trạng thái Loading ban đầu -->
                        <tr id="loadingState">
                            <td colspan="4" class="p-12 text-center text-gray-500">
                                <i class="fa-solid fa-spinner fa-spin text-4xl text-indigo-500 mb-4"></i>
                                <p class="font-medium">Đang tải dữ liệu, vui lòng đợi...</p>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
            
            <!-- Footer/Stats -->
            <div class="p-5 bg-indigo-50/50 border-t border-indigo-100 flex justify-between items-center text-sm md:text-base text-gray-700">
                <div class="flex items-center gap-2">
                    <div class="p-2 bg-indigo-100 rounded-lg text-indigo-600"><i class="fa-solid fa-user-graduate"></i></div>
                    <span>Đã nộp: <strong id="totalCount" class="text-indigo-700 text-xl">0</strong></span>
                </div>
                <div class="flex items-center gap-2">
                    <div class="p-2 bg-emerald-100 rounded-lg text-emerald-600"><i class="fa-solid fa-sack-dollar"></i></div>
                    <span>Tổng tiền: <strong id="totalAmount" class="text-emerald-600 text-xl">0 đ</strong></span>
                </div>
            </div>
        </div>
    </div>

    <script>
        const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbwexSrT5NJXY4K0zahe07at-4adnTfN1FiAPEhKiLov05Xo4Xioj0b8iScgDqxGVgLfrA/exec";
        
        let allData = [];

        // Khởi tạo
        document.addEventListener('DOMContentLoaded', () => {
            loadData();

            // Tính năng Tìm kiếm (Lọc dữ liệu trên Frontend)
            document.getElementById('searchInput').addEventListener('input', (e) => {
                const searchTerm = removeVietnameseTones(e.target.value.toLowerCase());
                const filteredData = allData.filter(student => 
                    removeVietnameseTones((student.name || '').toLowerCase()).includes(searchTerm)
                );
                renderTable(filteredData);
            });
        });

        // Fetch Data từ GAS API
        async function loadData() {
            const refreshBtn = document.getElementById('refreshBtn');
            const refreshIcon = document.getElementById('refreshIcon');
            const tbody = document.getElementById('dataTableBody');
            
            // Trạng thái Loading
            refreshBtn.disabled = true;
            refreshIcon.classList.add('fa-spin');
            tbody.innerHTML = `
                <tr id="loadingState">
                    <td colspan="4" class="p-12 text-center text-gray-500">
                        <i class="fa-solid fa-spinner fa-spin text-4xl text-indigo-500 mb-4"></i>
                        <p class="font-medium">Đang tải dữ liệu từ Google Sheets...</p>
                    </td>
                </tr>
            `;

            try {
                // Gọi tới doGet của Apps Script, kèm tham số action=getCompletedStudents
                const response = await fetch(`${WEB_APP_URL}?action=getCompletedStudents`);
                const result = await response.json();
                
                if (result.status === 'success') {
                    allData = result.data;
                    renderTable(allData);
                } else {
                    throw new Error(result.message);
                }
            } catch (error) {
                console.error("Lỗi Fetch Data:", error);
                showError("Không thể tải dữ liệu: " + (error.message || "Lỗi mạng hoặc URL chưa chính xác."));
            } finally {
                refreshBtn.disabled = false;
                refreshIcon.classList.remove('fa-spin');
            }
        }

        // Render bảng HTML
        function renderTable(data) {
            const tbody = document.getElementById('dataTableBody');
            const totalCountEl = document.getElementById('totalCount');
            const totalAmountEl = document.getElementById('totalAmount');
            
            if (!data || data.length === 0) {
                tbody.innerHTML = `
                    <tr id="emptyState">
                        <td colspan="4" class="p-12 text-center text-gray-400">
                            <i class="fa-solid fa-box-open text-5xl mb-4 block opacity-50"></i>
                            <p class="text-lg">Danh sách trống hoặc không tìm thấy kết quả.</p>
                        </td>
                    </tr>
                `;
                totalCountEl.textContent = "0";
                totalAmountEl.textContent = "0 đ";
                return;
            }

            let html = '';
            let totalAmount = 0;

            data.forEach((student, index) => {
                // Tính tổng tiền
                let amt = 0;
                if(student.amount) {
                     const cleanAmt = String(student.amount).replace(/[^0-9.-]+/g,"");
                     amt = parseFloat(cleanAmt) || 0;
                     totalAmount += amt;
                }

                // Huy hiệu trạng thái đóng tiền
                let statusBadge = '';
                const status = (student.status || '').toString().toLowerCase().trim();
                
                if (status.includes('chuyển khoản') || status.includes('ck')) {
                    statusBadge = `<span class="px-3.5 py-1.5 bg-blue-100 text-blue-700 rounded-full text-xs font-semibold shadow-sm"><i class="fa-solid fa-money-check-dollar mr-1.5"></i>Chuyển khoản</span>`;
                } else if (status.includes('tiền mặt') || status.includes('tm')) {
                    statusBadge = `<span class="px-3.5 py-1.5 bg-emerald-100 text-emerald-700 rounded-full text-xs font-semibold shadow-sm"><i class="fa-solid fa-money-bill-wave mr-1.5"></i>Tiền mặt</span>`;
                } else {
                    statusBadge = `<span class="px-3.5 py-1.5 bg-gray-100 text-gray-700 rounded-full text-xs font-semibold shadow-sm">${student.status}</span>`;
                }

                html += `
                    <tr class="hover:bg-indigo-50 transition-colors group">
                        <td class="p-4 text-center font-medium text-gray-500">${index + 1}</td>
                        <td class="p-4 font-semibold text-gray-800">${student.name || '-'}</td>
                        <td class="p-4 text-right font-bold text-indigo-600">${formatMoney(student.amount)}</td>
                        <td class="p-4 text-center">${statusBadge}</td>
                    </tr>
                `;
            });

            tbody.innerHTML = html;
            totalCountEl.textContent = data.length;
            totalAmountEl.textContent = formatMoney(totalAmount);
        }

        // Tiện ích Format Tiền Tệ
        function formatMoney(amount) {
            if (!amount && amount !== 0) return '-';
            if (typeof amount === 'number' || !isNaN(parseFloat(amount))) {
                const num = parseFloat(amount.toString().replace(/[^0-9.-]+/g,""));
                return num.toLocaleString('vi-VN') + ' đ';
            }
            return amount; // Trường hợp chuỗi chữ
        }

        // Tiện ích Báo lỗi UI
        function showError(message) {
            const tbody = document.getElementById('dataTableBody');
            tbody.innerHTML = `
                <tr>
                    <td colspan="4" class="p-8 text-center text-red-500 bg-red-50">
                        <i class="fa-solid fa-circle-exclamation text-3xl mb-3"></i>
                        <p class="font-medium">${message}</p>
                    </td>
                </tr>
            `;
        }

        // Tiện ích loại bỏ dấu tiếng Việt để tìm kiếm
        function removeVietnameseTones(str) {
            if(!str) return "";
            str = str.replace(/à|á|ạ|ả|ã|â|ầ|ấ|ậ|ẩ|ẫ|ă|ằ|ắ|ặ|ẳ|ẵ/g, "a");
            str = str.replace(/è|é|ẹ|ẻ|ẽ|ê|ề|ế|ệ|ể|ễ/g, "e");
            str = str.replace(/ì|í|ị|ỉ|ĩ/g, "i");
            str = str.replace(/ò|ó|ọ|ỏ|õ|ô|ồ|ố|ộ|ổ|ỗ|ơ|ờ|ớ|ợ|ở|ỡ/g, "o");
            str = str.replace(/ù|ú|ụ|ủ|ũ|ư|ừ|ứ|ự|ử|ữ/g, "u");
            str = str.replace(/ỳ|ý|ỵ|ỷ|ỹ/g, "y");
            str = str.replace(/đ/g, "d");
            str = str.replace(/À|Á|Ạ|Ả|Ã|Â|Ầ|Ấ|Ậ|Ẩ|Ẫ|Ă|Ằ|Ắ|Ặ|Ẳ|Ẵ/g, "A");
            str = str.replace(/È|É|Ẹ|Ẻ|Ẽ|Ê|Ề|Ế|Ệ|Ể|Ễ/g, "E");
            str = str.replace(/Ì|Í|Ị|Ỉ|Ĩ/g, "I");
            str = str.replace(/Ò|Ó|Ọ|Ỏ|Õ|Ô|Ồ|Ố|Ộ|Ổ|Ỗ|Ơ|Ờ|Ớ|Ợ|Ở|Ỡ/g, "O");
            str = str.replace(/Ù|Ú|Ụ|Ủ|Ũ|Ư|Ừ|Ứ|Ự|Ử|Ữ/g, "U");
            str = str.replace(/Ỳ|Ý|Ỵ|Ỷ|Ỹ/g, "Y");
            str = str.replace(/Đ/g, "D");
            return str;
        }
    </script>
</body>
</html>
